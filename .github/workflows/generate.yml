name: Generate

on:
  schedule:
    # 22:17 UTC = 06:17 Asia/Taipei, off the top of the hour.
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: fetch data, render, publish dist
    # Only publish from the default branch, even for manual dispatches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Credentials are not persisted in .git/config, so dependency code run by
      # install/data/generate cannot read the write token from disk. The token
      # is supplied only to the final push step.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GANEZHA_TOKEN is an optional read-only token for private contributions;
      # without it the built-in token is used. fetch-data.ts reads GITHUB_TOKEN.
      - name: Fetch profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GANEZHA_TOKEN || secrets.GITHUB_TOKEN }}
        run: bun run data

      # Fail-closed: generate validates all 30 assets in memory and leaves
      # dist/ untouched (non-zero exit) if any asset fails.
      - name: Generate assets
        run: bun run generate

      - name: Commit and push dist
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "dist/ unchanged; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist
          git commit -m 'chore(dist): update profile assets'
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
